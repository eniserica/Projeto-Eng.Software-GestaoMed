<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class = "body-acessar">
    <main class = "main-acessar">
        <div class = "acessar-container">
            <div class = "logo-acessar">
                <img src="{{ url_for('imagens', filename='logo-fundoBranco.png') }}" alt="Logo do sistema">
            </div>
            {% if not tipo %}
            <h3>Acesse sua conta</h3>

            <div class = "usuarios-container">
                <a class = "usuario-card" href="{{url_for('login', tipo='paciente')}}">
                    <h2>Paciente</h2>
                </a>
                <a class = "usuario-card" href="{{url_for('login', tipo='medico')}}">
                    <h2>Médico</h2>
                </a>
                <a class = "usuario-card" href="{{url_for('login', tipo='administrador')}}">
                    <h2>Administrador</h2>
                </a>
            </div>

            {% else %}
                <h3>Acesse como {{ tipo|replace('medico', 'médico')|capitalize }}</h3>
            
                <a href="{{ url_for('login') }}">Escolher outro perfil</a>

                <input type="email" placeholder="E-mail">
                <input type = "password" placeholder = "Senha">
                
                <button class = "btn-entrar">Entrar</button>

                <p>Não possui uma conta? <a href = "{{ url_for('cadastro', tipo=tipo) }}">Cadastre-se</a></p>

                {% endif %}
        </div>    
    </main>
</body>
</html>
